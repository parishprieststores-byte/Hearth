@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>

const CFG={apiKey:"AIzaSyBfWIs9ZefFaqOwI_t6PTiYzoXjE8_lZf0",authDomain:"hearth-priest.firebaseapp.com",projectId:"hearth-priest",storageBucket:"hearth-priest.firebasestorage.app",messagingSenderId:"216702789254",appId:"1:216702789254:web:1da7b2384e8a672f3ad307"};

const ftime=t=>t&&t.toDate?t.toDate().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('o');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('o'),3000)}

/* ---- names: any Unicode (styled text, emoji) ---- */
const seg=s=>window.Intl&&Intl.Segmenter?[...new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(String(s))].map(x=>x.segment):Array.from(String(s));
const clip=(s,n=40)=>seg(s).slice(0,n).join('');
const av=(n,sz)=>{const g=seg(String(n).trim())[0]||'?',hue=Array.from(String(n)).reduce((a,c)=>(a*31+c.codePointAt(0))|0,7)%360;
 return`<span class="av" style="background:hsl(${Math.abs(hue)} 50% 40%)${sz?`;width:${sz}px;height:${sz}px`:''}">${esc(g.toUpperCase())}</span>`};
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---- theme ---- */
const mq=matchMedia('(prefers-color-scheme:dark)');

mq.addEventListener('change',applyTheme);applyTheme();

/* ---- sound ---- */
let ac=null,muted=false;try{muted=localStorage.getItem('hearth-mute')==='1'}catch(e){}
function unlock(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
['touchstart','click','keydown'].forEach(t=>addEventListener(t,unlock,{passive:true}));
function ping(){if(muted||!ac)return;try{const t=ac.currentTime;[880,1175].forEach((f,i)=>{const s=t+i*.12,o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.25,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+.3);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+.35)})}catch(e){}}
function toggleMute(){muted=!muted;try{localStorage.setItem('hearth-mute',muted?'1':'0')}catch(e){}const b=$('#mu');if(b){b.innerHTML=ic(muted?'belloff':'bell');b.setAttribute('aria-label',muted?'Unmute sounds':'Mute sounds')}toast(muted?'Sounds muted':'Sounds on');if(!muted)ping()}

/* ---- modal ---- */
function modal(html){const d=$('#dlg'),prev=document.activeElement;d.innerHTML=`<div class="card" role="dialog" aria-modal="true">${html}</div>`;d.classList.add('o');
 const close=()=>{d.classList.remove('o');d.innerHTML='';document.removeEventListener('keydown',k);prev&&prev.focus&&prev.focus()};
 const k=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',k);
 d.onclick=e=>{if(e.target===d)close()};const f=$('input',d);f&&f.focus();return{el:d,close}}

if(typeof firebase==='undefined'){view(`<main class="auth"><div class="logo">${ic('flame')}</div><h1>Can't load</h1><p>The Firebase scripts did not load. Open the published site in a normal browser with an internet connection, not a file preview.</p></main>`)}
else if(CFG.apiKey.startsWith('YOUR')){view(`<main class="auth"><div class="logo">${ic('flame')}</div><h1>Setup needed</h1><p>Hearth needs your Firebase project. Open index.html, paste your web app config into <b>CFG</b>, publish firestore.rules, and enable Email/Password sign-in. Steps are in NOTES.md.</p></main>`)}
else{
firebase.initializeApp(CFG);
const auth=firebase.auth(),db=firebase.firestore(),FV=firebase.firestore.FieldValue;
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
let me=null,chats=[],cur=null,unList=null,unMsg=null,unChat=null,typeT=0,typeTimer=0;
const myName=()=>auth.currentUser.displayName||auth.currentUser.email;

/* ---- auth ---- */
function authView(mode='in',err=''){const up=mode==='up';
 view(`<main class="auth"><div class="logo">${ic('flame')}</div><h1>Hearth</h1>
 <div class="seg"><button data-m="in" class="${up?'':'on'}">Sign in</button><button data-m="up" class="${up?'on':''}">Create account</button></div>
 <form id="af" style="display:flex;flex-direction:column;gap:14px">
 ${up?'<label><span>Name</span><input id="nm" autocomplete="name" required maxlength="120"></label>':''}
 <label><span>Email</span><input id="em" type="email" autocomplete="email" required></label>
 <label><span>Password</span><div class="pw"><input id="pw" type="password" autocomplete="${up?'new-password':'current-password'}" minlength="6" required><button type="button" id="eye" class="ib" aria-label="Show password" aria-pressed="false">${ic('eye')}</button></div></label>
 <p class="err" role="alert">${esc(err)}</p><button class="pri" type="submit">${up?'Create account':'Sign in'}</button></form></main>`);
 document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>authView(b.dataset.m));
 $('#eye').onclick=()=>{const p=$('#pw'),s=p.type==='password',b=$('#eye');p.type=s?'text':'password';b.innerHTML=ic(s?'eyeoff':'eye');b.setAttribute('aria-label',s?'Hide password':'Show password');b.setAttribute('aria-pressed',String(s))};
 $('#af').onsubmit=async e=>{e.preventDefault();const em=$('#em').value.trim(),pw=$('#pw').value;
  try{if(up){const n=clip($('#nm').value.trim()),c=await auth.createUserWithEmailAndPassword(em,pw);
    await c.user.updateProfile({displayName:n});
    await db.collection('users').doc(c.user.uid).set({name:n,nameLower:n.normalize('NFKC').toLowerCase(),email:em});
    listenChats();listView()}
   else await auth.signInWithEmailAndPassword(em,pw)}
  catch(x){authView(mode,x.code==='auth/invalid-credential'?'Wrong email or password.':x.code==='auth/email-already-in-use'?'That email already has an account.':x.message)}}}

auth.onAuthStateChanged(u=>{me=u;unList&&unList();unList=null;
 if(u){listenChats();listView()}else{chats=[];cur=null;authView()}});

/* ---- chat list ---- */
const cname=c=>c.isGroup?c.title:c.members.length===1?'Saved messages':(c.names[c.members.find(x=>x!==me.uid)]||'Chat');
let prevUn={},primed=false;

 if(hit){ping();if(!cur||cur.id!==hit.id)toast('New message from '+cname(hit))}if(!fromCache)primed=true}

 unList=db.collection('chats').where('members','array-contains',me.uid).onSnapshot(s=>{
  chats=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>((b.lastAt&&b.lastAt.seconds)||9e9)-((a.lastAt&&a.lastAt.seconds)||9e9));notifyNew(s.metadata.fromCache);paintList()},
  ()=>toast('Could not load chats. Check rules and connection.'))}

 view(`<header class="bar"><h2>Hearth</h2><button id="mu" aria-label="${muted?'Unmute sounds':'Mute sounds'}">${ic(muted?'belloff':'bell')}</button><button id="th" aria-label="Switch theme">${ic('theme')}</button><button id="lo" aria-label="Sign out">${ic('out')}</button></header><div class="chips" id="ch"></div><div id="cl" class="list"></div><button id="fab" class="fab" aria-label="New chat">${ic('plus')}</button>`);
 $('#th').onclick=flipTheme;$('#mu').onclick=toggleMute;$('#lo').onclick=()=>auth.signOut();$('#fab').onclick=newChat;holdBind($('#cl'));paintChips();paintList()}

 mo.el.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{mo.close();acts[b.dataset.i][1]()});return mo}

const chatMenu=id=>{const c=chats.find(x=>x.id===id);if(c)sheet(prefActs(c))};
function holdBind(el){let t,fired=false,x0=0,y0=0;
 el.addEventListener('pointerdown',e=>{const r=e.target.closest('.row');if(!r)return;fired=false;x0=e.clientX;y0=e.clientY;t=setTimeout(()=>{fired=true;chatMenu(r.dataset.id)},500)});
 el.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-x0,e.clientY-y0)>10)clearTimeout(t)});
 ['pointerup','pointercancel','pointerleave'].forEach(k=>el.addEventListener(k,()=>clearTimeout(t)));
 el.addEventListener('click',e=>{if(fired){e.stopPropagation();e.preventDefault();fired=false}},true);
 el.addEventListener('contextmenu',e=>{const r=e.target.closest('.row');if(r){e.preventDefault();chatMenu(r.dataset.id)}})}
function paintChips(){const el=$('#ch');if(!el)return;
 el.innerHTML=[['all','All'],['unread','Unread'],['groups','Groups'],['arch','Archived']].map(([k,t])=>`<button class="chip${lf===k?' on':''}" data-f="${k}" aria-pressed="${lf===k}">${t}</button>`).join('');
 el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{lf=b.dataset.f;paintChips();paintList()})}
function paintList(){const el=$('#cl');if(!el)return;const L=chats.filter(vis).sort((a,b)=>!!pf(b,'pin')-!!pf(a,'pin'));
 if(!L.length){el.innerHTML=`<p class="empty">${chats.length?'Nothing in this view.':'No chats yet. Tap the + button to start one.'}</p>`;return}
 el.innerHTML=L.map(c=>{const n=cname(c),u=(c.unread||{})[me.uid]||0;
  return`<button class="row${u?' un':''}" data-id="${c.id}">${av(n)}<span class="mid"><b>${esc(n)}</b><small>${c.lastFrom===me.uid&&c.lastText?'You: ':''}${esc(c.lastText||'No messages yet')}</small></span><span class="rt"><small>${ftime(c.lastAt)}</small><span style="display:flex;gap:4px;align-items:center">${pf(c,'pin')?ic('pin'):''}${pf(c,'mute')?ic('belloff'):''}${u?`<i class="bd">${u}</i>`:''}</span></span></button>`}).join('');
 el.querySelectorAll('.row').forEach(b=>b.onclick=()=>openChat(chats.find(c=>c.id===b.dataset.id)))}

/* ---- new chat / group ---- */
function newChat(){const sel=new Map();let found=[],dt;
 const m=modal(`<h3>New chat</h3><label><span>Find people by name</span><input id="q" autocomplete="off"></label><button class="row" id="sv" style="min-height:56px;padding:8px 4px">${av('Saved messages')}<span class="mid"><b>Saved messages</b><small>Notes and files for yourself</small></span></button><div id="res" class="res"></div>
 <label id="gt" hidden><span>Group name</span><input id="gn" maxlength="40"></label>
 <div class="acts"><button class="ghost" id="cx">Close</button><button class="pri" id="go" disabled>Start chat</button></div>`);
 const paint=()=>{$('#res').innerHTML=found.length?found.map(u=>`<button class="row ${sel.has(u.id)?'s':''}" data-id="${u.id}">${av(u.name)}<span class="mid"><b>${esc(u.name)}</b></span>${sel.has(u.id)?ic('check'):''}</button>`).join(''):'<p class="empty">Type a name to search.</p>';
  $('#res').querySelectorAll('.row').forEach(b=>b.onclick=()=>{const u=found.find(x=>x.id===b.dataset.id);sel.has(u.id)?sel.delete(u.id):sel.set(u.id,u);paint()});
  const g=sel.size>1;$('#gt').hidden=!g;$('#go').disabled=!sel.size;$('#go').textContent=g?'Create group':'Start chat'};
 paint();$('#cx').onclick=m.close;
 $('#sv').onclick=async()=>{try{const ref=db.collection('chats').doc(me.uid+'_self');let s=await ref.get();
  if(!s.exists){await ref.set({members:[me.uid],names:{[me.uid]:'Saved messages'},isGroup:false,title:'',lastText:'',lastAt:FV.serverTimestamp(),unread:{},typing:{}});s=await ref.get()}
  m.close();openChat({id:ref.id,...s.data()})}catch(x){toast('Could not open Saved messages.')}};
 $('#q').oninput=e=>{clearTimeout(dt);const q=e.target.value.trim().normalize('NFKC').toLowerCase();
  dt=setTimeout(async()=>{if(!q){found=[...sel.values()];return paint()}
   try{const s=await db.collection('users').where('nameLower','>=',q).where('nameLower','<=',q+'\uf8ff').limit(15).get();
    found=s.docs.filter(d=>d.id!==me.uid).map(d=>({id:d.id,...d.data()}));sel.forEach(u=>{if(!found.some(f=>f.id===u.id))found.push(u)});paint()}
   catch(x){toast('Search failed. Are you online?')}},300)};
 $('#go').onclick=async()=>{const us=[...sel.values()],members=[me.uid,...us.map(u=>u.id)],names={[me.uid]:myName()};us.forEach(u=>names[u.id]=u.name);
  try{let ref,doc;
   if(us.length===1){ref=db.collection('chats').doc([...members].sort().join('_'));doc=await ref.get()}
   else{const t=$('#gn').value.trim();if(!t)return toast('Give the group a name first.');ref=db.collection('chats').doc()}
   if(!doc||!doc.exists)await ref.set({members,names,isGroup:us.length>1,title:us.length>1?$('#gn').value.trim():'',lastText:'',lastAt:FV.serverTimestamp(),unread:{},typing:{}});
   const snap=await ref.get();m.close();openChat({id:ref.id,...snap.data()})}
  catch(x){toast('Could not create the chat.')}}}

/* ---- chat screen ---- */
function leaveChat(){stopRec(false);stopVN();replyTo=null;flt={q:'',star:false};lastSnap=null;unMsg&&unMsg();unChat&&unChat();unMsg=unChat=null;cur=null;clearTimeout(typeTimer)}
function openChat(c,push=true){if(!c)return;cur=c;flt={q:'',star:false};replyTo=null;lastSnap=null;openUn=(c.unread||{})[me.uid]||0;if(push)history.pushState({chat:c.id},'');
 view(`<header class="bar"><button id="bk" aria-label="Back">${ic('back')}</button>${av(cname(c),40)}<div class="t"><b>${esc(cname(c))}</b><small id="sub"></small></div><button id="mo" class="ib" aria-label="Chat options">${ic('more')}</button></header>
 <div id="sr" class="rpl" hidden><label style="flex:1"><span>Search this chat</span><input id="sq" autocomplete="off"></label><button class="ghost" id="sx">Done</button></div>
 <div id="ms" class="msgs"></div><div id="rp" class="rpl" hidden></div>
 <div class="comp"><div id="rb" class="rb" hidden><i class="dot"></i><b id="rt">0:00</b><span style="flex:1;color:var(--mu)">Recording</span><button id="rx" class="ghost">Discard</button><button id="rs" class="pri">Send</button></div><input id="fi" type="file" accept="image/*" hidden><button id="im" class="ib" aria-label="Send photo">${ic('image')}</button><input id="tx" type="text" autocomplete="off" aria-label="Message" enterkeyhint="send"><button id="mc" class="ib" aria-label="Record voice note">${ic('mic')}</button><button id="sd" class="ib send" aria-label="Send">${ic('send')}</button></div>`);
 const cr=db.collection('chats').doc(c.id);
 $('#bk').onclick=()=>history.back();
 unChat=cr.onSnapshot(s=>{if(!s.exists)return;cur={id:s.id,...s.data()};const t=cur.typing||{};
  const who=cur.members.filter(u=>u!==me.uid&&Date.now()-(t[u]||0)<5000);
  const sub=$('#sub');if(sub)sub.textContent=who.length?'typing…':(cur.isGroup?cur.members.length+' members':'');
  clearTimeout(typeTimer);if(who.length)typeTimer=setTimeout(()=>{const s2=$('#sub');s2&&(s2.textContent=cur.isGroup?cur.members.length+' members':'')},5200)});
 unMsg=cr.collection('messages').orderBy('at').limitToLast(100).onSnapshot({includeMetadataChanges:true},s=>{paintMsgs(s);markRead(s,cr)});
 const send=()=>{const v=$('#tx').value.trim();if(!v)return;$('#tx').value='';post(v,null)};
 $('#sd').onclick=send;$('#tx').onkeydown=e=>{if(e.key==='Enter')send()};
 $('#tx').oninput=()=>{if(Date.now()-typeT>2500){typeT=Date.now();cr.update({['typing.'+me.uid]:Date.now()}).catch(()=>{})}};
 $('#im').onclick=()=>$('#fi').click();$('#mc').onclick=startRec;$('#rx').onclick=()=>stopRec(false);$('#rs').onclick=()=>stopRec(true);$('#ms').onclick=e=>{if(e.target.closest('.pl'))return vnClick(e);const b=e.target.closest('.m');if(b&&b.dataset.id)msgMenu(b.dataset.id)};$('#mo').onclick=chatOptions;$('#sq').oninput=e=>{flt.q=e.target.value;if(lastSnap)paintMsgs(lastSnap)};$('#sx').onclick=()=>{flt.q='';$('#sq').value='';$('#sr').hidden=true;if(lastSnap)paintMsgs(lastSnap)};paintReply();
 $('#fi').onchange=e=>{const f=e.target.files[0];if(f)shrink(f).then(d=>post('',d)).catch(()=>toast('That image could not be read.'))}}
function shrink(f){return new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const r=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*r;c.height=i.height*r;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.6))};i.onerror=no;i.src=u})}
function postTo(c,text,img,aud,fwd,rep){const cr=db.collection('chats').doc(c.id),b=db.batch();
 b.set(cr.collection('messages').doc(),{from:me.uid,text,img,audio:aud||null,reply:rep||null,fwd:!!fwd,at:FV.serverTimestamp(),readBy:[me.uid]});
 const up={lastFrom:me.uid,lastText:text||(aud?'Voice note':'Photo'),lastAt:FV.serverTimestamp()};c.members.forEach(u=>{if(u!==me.uid)up['unread.'+u]=FV.increment(1)});
 b.update(cr,up);b.commit().catch(()=>toast('Could not send that message.'))}
function post(text,img,aud){postTo(cur,text,img,aud,false,replyTo);replyTo=null;paintReply()}
let MS={},lastSnap=null,flt={q:'',star:false},openUn=0,replyTo=null;
const dKey=t=>(t&&t.toDate?t.toDate():new Date()).toDateString();
function dLbl(t){const d=t&&t.toDate?t.toDate():new Date(),n=new Date();return d.toDateString()===n.toDateString()?'Today':d.toDateString()===new Date(n-864e5).toDateString()?'Yesterday':d.toLocaleDateString([],{day:'numeric',month:'short',year:'numeric'})}
function paintMsgs(s){const el=$('#ms');if(!el)return;lastSnap=s;const near=el.scrollHeight-el.scrollTop-el.clientHeight<120;
 let docs=s.docs.filter(d=>!(d.data().hiddenFor||[]).includes(me.uid));MS={};docs.forEach(d=>MS[d.id]=d.data());
 const q=flt.q.trim().toLowerCase();if(q)docs=docs.filter(d=>(d.data().text||'').toLowerCase().includes(q));
 if(flt.star)docs=docs.filter(d=>(d.data().starredBy||[]).includes(me.uid));
 let ud=-1;if(openUn&&!q&&!flt.star){let n=0;for(let i=docs.length-1;i>=0;i--)if(docs[i].data().from!==me.uid&&++n===openUn){ud=i;break}}
 let last='';
 el.innerHTML=docs.map((d,i)=>{const m=d.data(),mine=m.from===me.uid,pend=d.metadata.hasPendingWrites,seen=mine&&cur.members.some(u=>u!==me.uid&&(m.readBy||[]).includes(u));
  const k=dKey(m.at),sep=k!==last?`<div class="day">${dLbl(m.at)}</div>`:'';last=k;
  const tk=mine&&!m.deleted?`<span class="tk ${seen?'rd':''}" title="${pend?'Sending':seen?'Read':'Delivered'}">${ic('check')}${pend?'':ic('check')}</span>`:'';
  const meta=`<span class="mt">${(m.starredBy||[]).includes(me.uid)?ic('star'):''}${m.edited&&!m.deleted?'edited ':''}${ftime(m.at)}${tk}</span>`,div=i===ud?'<div class="ud">Unread messages</div>':'';
  if(m.deleted)return sep+div+`<div class="m dl ${mine?'me':''}" data-id="${d.id}">This message was deleted${meta}</div>`;
  const rx={};Object.values(m.reactions||{}).forEach(e=>rx[e]=(rx[e]||0)+1);
  return sep+div+`<div class="m ${mine?'me':''}" data-id="${d.id}">${cur.isGroup&&!mine?`<span class="w">${esc(cur.names[m.from]||'Member')}</span>`:''}${m.fwd?'<span class="w" style="color:var(--mu)">Forwarded</span>':''}${m.reply?`<div class="q"><b>${esc(m.reply.name)}</b><span>${esc(m.reply.text)}</span></div>`:''}${m.audio?vn(d.id,m.audio):''}${m.img?`<img src="${m.img}" alt="Photo">`:''}${esc(m.text||'')}${Object.keys(rx).length?`<span class="rx">${Object.entries(rx).map(([e,n])=>`<i>${e}${n>1?' '+n:''}</i>`).join('')}</span>`:''}${meta}</div>`}).join('')||'<p class="empty">No messages to show.</p>';
 if(near||s.metadata.fromCache===false&&!el.dataset.k){el.scrollTop=el.scrollHeight;el.dataset.k=1}syncVN()}
function paintReply(){const el=$('#rp');if(!el)return;el.hidden=!replyTo;if(!replyTo){el.innerHTML='';return}
 el.innerHTML=`<div class="q"><b>Replying to ${esc(replyTo.name)}</b><span>${esc(replyTo.text)}</span></div><button class="ib" id="rpx" aria-label="Cancel reply">${ic('x')}</button>`;$('#rpx').onclick=()=>{replyTo=null;paintReply()}}
function setReply(id){const m=MS[id];replyTo={id,name:cur.names[m.from]||'Member',text:m.text||(m.audio?'Voice note':'Photo')};paintReply();$('#tx').focus()}
function msgMenu(id){const m=MS[id];if(!m)return;const mine=m.from===me.uid,cr=db.collection('chats').doc(cur.id).collection('messages').doc(id),del=!!m.deleted,st=(m.starredBy||[]).includes(me.uid),acts=[];
 if(!del){acts.push(['Reply',()=>setReply(id)]);
  if(m.text)acts.push(['Copy text',()=>navigator.clipboard.writeText(m.text).then(()=>toast('Copied'),()=>toast('Could not copy.'))]);
  acts.push(['Forward',()=>fwdPick(m)]);
  acts.push([st?'Remove star':'Star message',()=>cr.update({starredBy:st?FV.arrayRemove(me.uid):FV.arrayUnion(me.uid)})]);
  if(mine&&m.text&&!m.audio&&!m.img)acts.push(['Edit message',()=>editMsg(cr,m)]);
  if(mine&&cur.isGroup)acts.push(['Who has read this',()=>{const r=cur.members.filter(u=>u!==me.uid&&(m.readBy||[]).includes(u)).map(u=>cur.names[u]||'Member');const x=modal(`<h3>Read by</h3><p>${r.length?esc(r.join(', ')):'Nobody yet.'}</p><div class="acts"><button class="pri" id="rd">Back to chat</button></div>`);$('#rd').onclick=x.close}])}
 acts.push(['Delete for me',()=>cr.update({hiddenFor:FV.arrayUnion(me.uid)})]);
 if(mine&&!del)acts.push(['Delete for everyone',()=>confirmD('Delete for everyone?','This removes the message for all members and cannot be undone.','Delete for everyone',()=>cr.update({deleted:true,text:'',img:null,audio:null}))]);
 const mo=sheet(acts,del?'':'<div class="emo">'+['👍','❤️','😂','😮','😢','🙏'].map(e=>`<button data-e="${e}" aria-label="React ${e}">${e}</button>`).join('')+'</div>');
 mo.el.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const same=(m.reactions||{})[me.uid]===b.dataset.e;cr.update({['reactions.'+me.uid]:same?FV.delete():b.dataset.e});mo.close()})}
function editMsg(cr,m){const x=modal(`<h3>Edit message</h3><label><span>Message</span><input id="ed"></label><div class="acts"><button class="ghost" id="ec">Keep original</button><button class="pri" id="es">Save change</button></div>`);
 $('#ed').value=m.text;$('#ec').onclick=x.close;$('#es').onclick=()=>{const v=$('#ed').value.trim();if(!v)return toast('A message cannot be empty.');x.close();if(v!==m.text)cr.update({text:v,edited:true})}}
function fwdPick(m){const x=modal(`<h3>Forward to</h3><div class="res">${chats.map(c=>`<button class="row" data-id="${c.id}">${av(cname(c))}<span class="mid"><b>${esc(cname(c))}</b></span></button>`).join('')}</div><div class="acts"><button class="ghost" id="fc">Cancel</button></div>`);
 $('#fc').onclick=x.close;x.el.querySelectorAll('.row').forEach(b=>b.onclick=()=>{const c=chats.find(y=>y.id===b.dataset.id);x.close();postTo(c,m.text||'',m.img||null,m.audio||null,true,null);toast('Forwarded to '+cname(c))})}
function chatOptions(){sheet([['Search in this chat',()=>{$('#sr').hidden=false;$('#sq').focus()}],[flt.star?'Show all messages':'Show starred messages',()=>{flt.star=!flt.star;if(lastSnap)paintMsgs(lastSnap);toast(flt.star?'Showing starred messages':'Showing all messages')}],...prefActs(cur)])}
function markRead(s,cr){if(s.metadata.hasPendingWrites)return;const un=s.docs.filter(d=>d.data().from!==me.uid&&!(d.data().readBy||[]).includes(me.uid));
 if(un.length){const b=db.batch();un.forEach(d=>b.update(d.ref,{readBy:FV.arrayUnion(me.uid)}));b.commit().catch(()=>{})}
 if(((cur.unread||{})[me.uid]||0)>0)cr.update({['unread.'+me.uid]:0}).catch(()=>{})}

/* ---- voice notes ---- */
const vnData={},vnDur={};let rec=null,vnA=null,vnId=null;
const fmtS=s=>Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0');
function vn(id,a){vnData[id]=a.d;vnDur[id]=a.s;return`<div class="vn"><button class="ib pl" data-v="${id}" aria-label="Play voice note">${ic('play')}</button><span class="pb"><i></i></span><small>${fmtS(a.s)}</small></div>`}
function info(t){const m=modal(`<h3>Voice notes</h3><p>${esc(t)}</p><div class="acts"><button class="pri" id="ix">Back to chat</button></div>`);$('#ix').onclick=m.close}
function paintComp(){const c=$('.comp'),b=$('#rb');if(c)c.classList.toggle('rec',!!rec);if(b)b.hidden=!rec}
async function startRec(){if(rec)return;
 if(!navigator.mediaDevices||!window.MediaRecorder)return info('This browser cannot record audio. Try Chrome on Android or Safari on iPhone.');
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});
  const mime=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(x=>MediaRecorder.isTypeSupported(x));
  const r=new MediaRecorder(st,mime?{mimeType:mime,audioBitsPerSecond:24000}:{}),x={r,st,ch:[],t0:Date.now(),send:false};
  r.ondataavailable=e=>{if(e.data.size)x.ch.push(e.data)};
  r.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearInterval(x.iv);rec=null;paintComp();if(x.send)finishRec(x,r.mimeType)};
  rec=x;r.start();x.iv=setInterval(()=>{const s=(Date.now()-x.t0)/1000,t=$('#rt');if(t)t.textContent=fmtS(s);if(s>=60)stopRec(true)},250);paintComp()}
 catch(e){info('Microphone access is blocked. Allow the microphone for this site in your browser settings, then try again.')}}
function stopRec(send){if(!rec||rec.r.state==='inactive')return;rec.send=send;rec.r.stop()}
function finishRec(x,mime){const s=Math.round((Date.now()-x.t0)/1000);if(s<1)return toast('That voice note was too short.');
 const fr=new FileReader();fr.onload=()=>{if(fr.result.length>900000)return toast('That voice note is too large to send.');post('',null,{d:fr.result,s})};
 fr.readAsDataURL(new Blob(x.ch,{type:mime||'audio/webm'}))}
function vnClick(e){const b=e.target.closest('.pl');if(!b)return;const id=b.dataset.v;
 if(vnId===id&&vnA){if(vnA.paused)vnA.play();else vnA.pause();return}
 stopVN();vnId=id;vnA=new Audio(vnData[id]);
 vnA.ontimeupdate=syncVN;vnA.onpause=syncVN;vnA.onplay=syncVN;vnA.onended=stopVN;
 vnA.play().catch(()=>{toast('Could not play that voice note.');stopVN()})}
function stopVN(){if(vnA){vnA.onpause=vnA.onplay=vnA.ontimeupdate=vnA.onended=null;vnA.pause()}vnA=null;vnId=null;syncVN()}
function syncVN(){document.querySelectorAll('.pl').forEach(b=>{const id=b.dataset.v,on=id===vnId&&vnA,pl=on&&!vnA.paused;
 b.innerHTML=ic(pl?'pause':'play');b.setAttribute('aria-label',pl?'Pause voice note':'Play voice note');
 const i=b.parentNode.querySelector('.pb i');if(i)i.style.width=on?Math.min(100,vnA.currentTime/(vnDur[id]||1)*100)+'%':'0'})}

/* ---- navigation ---- */
history.replaceState({},'');
addEventListener('popstate',e=>{if(me&&!(e.state&&e.state.chat))listView()});
}
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));
 let had=!!navigator.serviceWorker.controller,rl=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!rl&&!document.querySelector('.comp.rec')){rl=true;location.reload()}had=true})}
</script></body></html>
