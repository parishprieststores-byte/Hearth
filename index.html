function shrink(f,mx=PH[S.photo][0],q=PH[S.photo][1]){return new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const r=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*r;c.height=i.height*r;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',q))};i.onerror=no;i.src=u})}

 b.update(cr,up);b.commit().then(()=>{if(!(extra&&extra.call)&&c.members.length>1)notifyPush({kind:'chat',chatId:c.id})}).catch(e=>failSend({c,text,img,aud,fwd,rep,file,extra},e))}

const FAIL=new Map(),UPL=new Map(),FC=new Map();let fq=0;
const MAXF=5000000,CH=700000,BLOCK=/\.(exe|msi|bat|cmd|com|scr|apk|jar|vbs|ps1|js|sh|dll|lnk)$/i;
const fIcon=n=>{const x=(n.split('.').pop()||'').toLowerCase();return x==='pdf'?'PDF':/^(doc|docx|odt|rtf)$/.test(x)?'DOC':/^(xls|xlsx|csv|ods)$/.test(x)?'XLS':/^(ppt|pptx)$/.test(x)?'PPT':/^(zip|rar|7z|gz|tar)$/.test(x)?'ZIP':/^(mp4|mov|webm|3gp|mkv)$/.test(x)?'VID':/^(mp3|m4a|wav|ogg|aac)$/.test(x)?'AUD':/^(jpg|jpeg|png|gif|webp|heic)$/.test(x)?'IMG':/^(txt|md)$/.test(x)?'TXT':'FILE'};
const fSz=b=>b>=1e6?(b/1e6).toFixed(1)+' MB':Math.max(1,Math.round(b/1e3))+' KB';
const fileCard=(id,f)=>`<div class="fc"><span class="fi2">${fIcon(f.name)}</span><span class="mid"><b>${esc(f.name)}</b><small>${fSz(f.size)}</small></span><button class="ghost" data-dl="${id}">Download</button></div>`;
function failSend(o,e){FAIL.set('f'+(++fq),o);toast(e&&e.code==='permission-denied'?'Not sent. The database refused it. Publish the latest firestore.rules.':'Not sent. Use Retry above the message box.');paintUL()}
function paintUL(){const el=$('#ul');if(!el||!cur)return;const rows=[];
 UPL.forEach((u,id)=>{if(u.c.id!==cur.id)return;rows.push(`<div class="ul"><span class="mid"><b>${esc(u.name)}</b><small>${u.state==='fail'?esc(u.err||'Upload paused'):u.state==='post'?'Sending…':'Uploading '+u.pct+'%'}</small><i class="pbar"><b style="width:${u.pct}%"></b></i></span>${u.state==='fail'?`<button class="ghost" data-ur="${id}">Retry</button>`:''}<button class="ghost" data-uc="${id}">${u.state==='fail'?'Delete':'Cancel'}</button></div>`)});
 FAIL.forEach((o,id)=>{if(o.c.id!==cur.id)return;rows.push(`<div class="ul"><span class="mid"><b style="color:var(--er)">Not sent</b><small>${esc(o.text||(o.file?o.file.name:o.aud?'Voice note':'Photo'))}</small></span><button class="ghost" data-fr="${id}">Retry</button><button class="ghost" data-fd="${id}">Delete</button></div>`)});
 el.innerHTML=rows.join('');
