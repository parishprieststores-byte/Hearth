function tonePick(){const cid=cur.id,list=[['','Default (your main tone)']].concat(Object.entries(TONES).map(([k,v])=>[k,v[0]])).concat(S.customName?[['custom',S.customName+' (yours)']]:[]),t0=(S.ct||{})[cid]||'';
 const x=modal(`<h3>Tone for this chat</h3><div class="res" role="radiogroup">${list.map(([k,n])=>`<button class="row" role="radio" aria-checked="${t0===k}" data-ct="${k}"><span class="mid"><b>${esc(n)}</b></span>${t0===k?'<span style="color:var(--ac);display:flex">'+ic('check')+'</span>':''}</button>`).join('')}</div><div class="acts"><button class="pri" id="tc">Done</button></div>`);
 $('#tc').onclick=x.close;x.el.querySelectorAll('[data-ct]').forEach(b=>b.onclick=()=>{S.ct=S.ct||{};if(b.dataset.ct)S.ct[cid]=b.dataset.ct;else delete S.ct[cid];saveS();if(b.dataset.ct)playTone(b.dataset.ct);x.close()})}

/* ---- voice notes ---- */
const vnData={},vnDur={};let rec=null,vnA=null,vnId=null,vnRate=1;
const fmtS=s=>Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0');
function vn(id,a){vnData[id]=a.d;vnDur[id]=a.s;return`<div class="vn"><button class="ib pl" data-v="${id}" aria-label="Play voice note">${ic('play')}</button><span class="pb"><i></i></span><small>${fmtS(a.s)}</small><button class="spd" aria-label="Playback speed">${vnRate}x</button></div>`}
function info(t){const m=modal(`<h3>Voice notes</h3><p>${esc(t)}</p><div class="acts"><button class="pri" id="ix">Back to chat</button></div>`);$('#ix').onclick=m.close}
function paintComp(){const c=$('.comp'),b=$('#rb');if(c)c.classList.toggle('rec',!!rec);if(b)b.hidden=!rec}
async function startRec(){if(rec)return;
 if(!navigator.mediaDevices||!window.MediaRecorder)return info('This browser cannot record audio. Try Chrome on Android or Safari on iPhone.');
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});
  const mime=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(x=>MediaRecorder.isTypeSupported(x));
  const r=new MediaRecorder(st,mime?{mimeType:mime,audioBitsPerSecond:24000}:{}),x={r,st,ch:[],t0:Date.now(),send:false};
  r.ondataavailable=e=>{if(e.data.size)x.ch.push(e.data)};
  r.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearInterval(x.iv);rec=null;paintComp();if(x.send)finishRec(x,r.mimeType)};
  rec=x;r.start();x.iv=setInterval(()=>{const s=(Date.now()-x.t0)/1000,t=$('#rt');if(t)t.textContent=fmtS(s);if(s>=60)stopRec(true)},250);paintComp()}
 catch(e){info('Microphone access is blocked. Allow the microphone for this site in your browser settings, then try again.')}}
function stopRec(send){if(!rec||rec.r.state==='inactive')return;rec.send=send;rec.r.stop()}
function finishRec(x,mime){const s=Math.round((Date.now()-x.t0)/1000);if(s<1)return toast('That voice note was too short.');
 const fr=new FileReader();fr.onload=()=>{if(fr.result.length>900000)return toast('That voice note is too large to send.');post('',null,{d:fr.result,s})};
 fr.readAsDataURL(new Blob(x.ch,{type:mime||'audio/webm'}))}
function vnClick(e){const b=e.target.closest('.pl');if(!b)return;const id=b.dataset.v;
 if(vnId===id&&vnA){if(vnA.paused)vnA.play();else vnA.pause();return}
 stopVN();vnId=id;vnA=new Audio(vnData[id]);vnA.playbackRate=vnRate;
 vnA.ontimeupdate=syncVN;vnA.onpause=syncVN;vnA.onplay=syncVN;vnA.onended=stopVN;
 vnA.play().catch(()=>{toast('Could not play that voice note.');stopVN()})}
function stopVN(){if(vnA){vnA.onpause=vnA.onplay=vnA.ontimeupdate=vnA.onended=null;vnA.pause()}vnA=null;vnId=null;syncVN()}
function syncVN(){document.querySelectorAll('.pl').forEach(b=>{const id=b.dataset.v,on=id===vnId&&vnA,pl=on&&!vnA.paused;
 b.innerHTML=ic(pl?'pause':'play');b.setAttribute('aria-label',pl?'Pause voice note':'Play voice note');
 const i=b.parentNode.querySelector('.pb i');if(i)i.style.width=on?Math.min(100,vnA.currentTime/(vnDur[id]||1)*100)+'%':'0'})}

/* ---- navigation ---- */
history.replaceState({k:'list',tab:'chats'},'');
addEventListener('popstate',e=>{if(!me)return;const st=e.state||{k:'list',tab:'chats'};
 if(st.k==='modal'){if(!mClose)history.back();return}
 if(mClose)mClose(true);
 if(st.k==='chat'){if(!cur||cur.id!==st.id){const c=chats.find(x=>x.id===st.id);if(c)openChat(c,false);else{tab='chats';listView()}}return}
 const t=st.tab||'chats',s2=st.sub||null;if(cur||!$('#cl')||tab!==t||s2!==sub){tab=t;sub=s2;listView()}});
}
function showUpdate(){if($('#upd'))return;const b=document.createElement('div');b.id='upd';b.className='updbar';b.setAttribute('role','status');
 b.innerHTML='<span>A new version of Hearth is ready.</span><button class="pri" id="ur">Reload now</button>';document.body.appendChild(b);$('#ur').onclick=()=>location.reload()}
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));
 let had=!!navigator.serviceWorker.controller,rl=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!rl){const tx=document.getElementById('tx');if(document.querySelector('.comp.rec')||(tx&&tx.value.trim()))showUpdate();else{rl=true;location.reload()}}had=true});
 navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='hearth-update-ready')showUpdate()})}
</script></body></html>
